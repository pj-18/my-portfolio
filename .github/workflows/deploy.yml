name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every morning so new Letterboxd diary entries and Last.fm charts show up on their own.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read # "Up next" bookings are issues
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # `npm run build` pulls the latest Letterboxd feed, Last.fm charts and booked shows
      # (open "Up next" issues) first, then builds.
      # LASTFM_API_KEY is a repository secret (Settings → Secrets and variables → Actions).
      # Without it the build still passes; the soundtrack keeps its last committed data.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
