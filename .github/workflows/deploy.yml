name: Build and deploy

# Runs on every push to main, once a day (so the Letterboxd diary and chess
# ratings stay fresh), and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    # 18:17 UTC daily. Off the hour on purpose: GitHub delays jobs scheduled at :00.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Never run two deploys at once; a newer run replaces an older one still in progress.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Two things are worth keeping between runs:
      #  - src/data/cache: the last diary and ratings that were fetched successfully,
      #    so a day when Letterboxd is unreachable shows yesterday's data, not an older snapshot
      #  - node_modules/.astro: optimised images, so photos are not re-encoded every day
      # This step comes after `npm ci` because that command empties node_modules.
      - name: Restore data and image caches
        uses: actions/cache@v6
        with:
          path: |
            src/data/cache
            node_modules/.astro
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      # `npm run build` first runs scripts/fetch-data.mjs (the prebuild step).
      - name: Fetch data and build
        run: npm run build

      # Skipped until the repository variable CLOUDFLARE_PAGES_PROJECT is set,
      # so the workflow stays green before Cloudflare is connected.
      - name: Deploy to Cloudflare Pages
        if: vars.CLOUDFLARE_PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
