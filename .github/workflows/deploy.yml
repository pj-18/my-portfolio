name: Deploy to GitHub Pages

# Every push to main deploys. The scheduled refreshes live in their own workflows
# (refresh-films.yml once a day, refresh-music.yml at 4 AM and 4 PM IST) and start this one.
on:
  push:
    branches: [main]
  # Actions tab → "Deploy to GitHub Pages" → Run workflow: refresh on demand.
  workflow_dispatch:
    inputs:
      films:
        description: 'Fetch the latest Letterboxd diary'
        type: boolean
        default: true
      music:
        description: 'Fetch the latest Last.fm charts'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # The saved data is kept in the Actions cache (after every run), so nothing has to be committed
      # and a run that doesn't refresh a source still deploys its last fetch.
      # music.json also remembers the artwork/preview lookups, so each refresh only searches for new songs.
      - uses: actions/cache@v4
        with:
          path: src/data/letterboxd.json
          key: films-${{ github.run_id }}
          restore-keys: films-

      - uses: actions/cache@v4
        with:
          path: src/data/music.json
          key: music-${{ github.run_id }}
          restore-keys: music-

      # Pushes and manual runs with the boxes ticked fetch fresh data; the other sources only
      # fetch when there is nothing saved yet. A failed fetch falls back to the saved copy.
      - name: Letterboxd diary
        env:
          REFRESH: ${{ github.event_name != 'workflow_dispatch' || inputs.films }}
        run: |
          if [ "$REFRESH" = "true" ]; then node scripts/sync-letterboxd.ts; else node scripts/sync-letterboxd.ts --if-missing; fi

      # LASTFM_API_KEY is a repository secret (Settings → Secrets and variables → Actions).
      # Without it the build still passes; the soundtrack uses whatever music.json is saved (or is left out if there is none).
      - name: Last.fm charts
        env:
          REFRESH: ${{ github.event_name != 'workflow_dispatch' || inputs.music }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          if [ "$REFRESH" = "true" ]; then node scripts/sync-music.ts; else node scripts/sync-music.ts --if-missing; fi

      # Booked shows live in the UP_NEXT_SHOWS repository variable (the "Add a show" workflow writes it).
      - name: Booked shows
        run: node scripts/sync-up-next.ts
        env:
          UP_NEXT_SHOWS: ${{ vars.UP_NEXT_SHOWS }}

      - run: npm run build:offline
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
