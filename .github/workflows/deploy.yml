name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild twice a day so new Letterboxd diary entries and Last.fm charts show up on their own.
  # Cron runs in UTC: these are 4 AM and 4 PM India time (UTC+05:30).
  schedule:
    - cron: '30 22 * * *' # 04:00 IST
    - cron: '30 10 * * *' # 16:00 IST
  # Actions tab → "Deploy to GitHub Pages" → Run workflow: refresh everything on demand.
  workflow_dispatch:

permissions:
  contents: read
  issues: read # "Up next" bookings are issues
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # music.json remembers the artwork/preview lookups so each run only searches for new songs.
      # It is saved to the Actions cache after every run, so it doesn't need to be committed.
      - uses: actions/cache@v4
        with:
          path: src/data/music.json
          key: music-${{ github.run_id }}
          restore-keys: music-

      # `npm run build` pulls the latest Letterboxd feed, Last.fm charts and booked shows
      # (open "Up next" issues) first, then builds.
      # LASTFM_API_KEY is a repository secret (Settings → Secrets and variables → Actions).
      # Without it the build still passes; the soundtrack uses whatever music.json is saved (or is left out if there is none).
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
